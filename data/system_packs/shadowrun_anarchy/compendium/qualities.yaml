entity: quality
entries:
- {id: ace_pilot, name: Ace Pilot, tags: [positive, piloting], polarity: Positive, description: "+2 dice to Piloting (Other) tests.", source: {book: shadowrun_anarchy_core, page: 204}}
- {id: ambidextrous, name: Ambidextrous, tags: [positive, combat], polarity: Positive, description: "+2 dice when using two melee weapons.", source: {book: shadowrun_anarchy_core, page: 204}}
- {id: bruiser, name: Bruiser, tags: [positive, social], polarity: Positive, description: "+2 dice to Intimidation tests.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: catlike, name: Catlike, tags: [positive, stealth], polarity: Positive, description: "+2 dice for Stealth tests.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: codeslinger, name: Codeslinger, tags: [positive, matrix], polarity: Positive, description: "+2 dice to Hacking tests.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: guts, name: Guts, tags: [positive], polarity: Positive, description: "May reroll 2 dice when resisting fear or intimidation.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: high_pain_tolerance, name: High Pain Tolerance, tags: [positive, combat], polarity: Positive, description: "No damage dice penalties until the second row of damage boxes is filled.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: lucky, name: Lucky, tags: [positive, edge], polarity: Positive, description: "Increase Edge by +1.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: natural_athlete, name: Natural Athlete, tags: [positive, physical], polarity: Positive, description: "+2 dice for Athletics tests.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: silver_tongue, name: Silver Tongue, tags: [positive, social], polarity: Positive, description: "May reroll 2 dice on Charisma tests.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: allergy, name: "Allergy (Choose)", tags: [negative], polarity: Negative, description: "Choose an allergy and apply its situational penalty as agreed by the group.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: incompetent, name: "Incompetent (Selected Skill)", tags: [negative, skill], polarity: Negative, description: "Selected skill is severely impaired; use the catalog rule for the chosen skill.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: oblivious, name: Oblivious, tags: [negative, perception], polarity: Negative, description: "Penalty to Perception tests.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: sensitive_system, name: Sensitive System, tags: [negative, cyberware], polarity: Negative, description: "Increases the burden of cyberware Essence costs.", source: {book: shadowrun_anarchy_core, page: 205}}
- {id: shifty, name: Shifty, tags: [negative, social], polarity: Negative, description: "Penalty to Con tests.", source: {book: shadowrun_anarchy_core, page: 205}}
