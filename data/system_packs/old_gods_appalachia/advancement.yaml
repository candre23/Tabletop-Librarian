version: 1
actions:
- id: advance_tier
  title: Advance Tier
  description: After purchasing all four character benefits, increase Tier and review newly available Type and Focus
    abilities.
  available_when: tier < 6
  changes:
    tier: tier + 1
  steps:
  - id: advancement_review
    title: Advancement Review
    description: Update Effort, Pools/Edge, skills, and abilities to reflect the four benefits purchased and the
      new tier.
    fields:
    - effort
    - might_alloc
    - speed_alloc
    - intellect_alloc
    - focus_benefits
    - skills
