version: 1
title: Create Old Gods of Appalachia Character
steps:
- id: identity
  title: Character Sentence
  description: Choose Type, identity/moniker, Descriptor, Focus, and Character Arc.
  fields:
  - name
  - character_type
  - identity
  - descriptor
  - focus
  - character_arc
  lock_after:
  - character_type
  - descriptor
  - focus
- id: stats
  title: Starting Stats
  description: Your Type sets starting Pools. Distribute exactly 6 additional points
    among Might, Speed, and Intellect. Protectors also choose their starting Might
    or Speed Edge.
  fields:
  - might_alloc
  - speed_alloc
  - intellect_alloc
  - protector_edge
  - effort
- id: training
  title: Abilities and Skills
  description: Choose the required first-tier Type abilities. Add the fixed Tier 1
    benefits from your Focus and record Type/Descriptor/Focus-granted skills or inabilities.
  fields:
  - type_abilities
  - focus_benefits
  - skills
- id: gear
  title: Gear and Cyphers
  description: Record starting weapons, armor, equipment, and GM-selected cyphers.
  fields:
  - armor_worn
  - weapons
  - armor_items
  - equipment
  - cyphers
  - artifacts
- id: story
  title: Background and Connections
  description: Record your Type background, Focus connections, arc progress, and other
    notes.
  fields:
  - background
  - connections
  - arc_progress
  - notes
final_changes:
  might_current: might_max
  speed_current: speed_max
  intellect_current: intellect_max
