modifiers:
  might_base:
    label: Might Base
    default: 0
    aggregate: sum
  speed_base:
    label: Speed Base
    default: 0
    aggregate: sum
  intellect_base:
    label: Intellect Base
    default: 0
    aggregate: sum
  might_bonus:
    label: Might Bonus
    default: 0
    aggregate: sum
  speed_bonus:
    label: Speed Bonus
    default: 0
    aggregate: sum
  intellect_bonus:
    label: Intellect Bonus
    default: 0
    aggregate: sum
  might_edge_bonus:
    label: Might Edge Bonus
    default: 0
    aggregate: sum
  speed_edge_bonus:
    label: Speed Edge Bonus
    default: 0
    aggregate: sum
  intellect_edge_bonus:
    label: Intellect Edge Bonus
    default: 0
    aggregate: sum
  armor_bonus:
    label: Armor Bonus
    default: 0
    aggregate: sum
calculated:
  might_max:
    formula: might_base + might_bonus + might_alloc
  speed_max:
    formula: speed_base + speed_bonus + speed_alloc
  intellect_max:
    formula: intellect_base + intellect_bonus + intellect_alloc
  might_edge:
    formula: might_edge_bonus + (1 if character_type == "explorer" else (1 if character_type == "protector" and
      protector_edge == "Might" else 0))
  speed_edge:
    formula: speed_edge_bonus + (1 if character_type == "protector" and protector_edge == "Speed" else 0)
  intellect_edge:
    formula: intellect_edge_bonus + (1 if character_type == "sage" or character_type == "speaker" else 0)
  armor:
    formula: armor_worn + armor_bonus
validation:
  stat_allocation:
    rule: might_alloc + speed_alloc + intellect_alloc == 6
    message: Beginning characters must distribute exactly 6 additional points among Might, Speed, and Intellect.
    severity: error
  protector_edge_choice:
    rule: character_type != "protector" or protector_edge != "Not applicable"
    message: Protectors must choose Might Edge 1 or Speed Edge 1.
    severity: error
  nonprotector_edge_choice:
    rule: character_type == "protector" or protector_edge == "Not applicable"
    message: Protector Starting Edge applies only to Protectors.
    severity: warning
  might_current_cap:
    rule: might_current <= might_max
    message: Current Might cannot exceed the calculated Might Pool maximum.
    severity: warning
  speed_current_cap:
    rule: speed_current <= speed_max
    message: Current Speed cannot exceed the calculated Speed Pool maximum.
    severity: warning
  intellect_current_cap:
    rule: intellect_current <= intellect_max
    message: Current Intellect cannot exceed the calculated Intellect Pool maximum.
    severity: warning
limits:
  type_ability_count:
    field: type_abilities
    label: First-Tier Type Abilities
    maximum: 3 if character_type == "sage" else 4
    require_full: true
    warning_message: 'First-Tier Type Abilities: {count} / {maximum}.'
    message: 'First-Tier Type Abilities: {count} selected, but this Type allows {maximum}.'
