tabs:
  - id: sheet
    title: Record Sheet
    sections:
      - id: identity
        title: Unit
        columns: 2
        fields: [name, chassis]
        color: teal
      - id: diagram
        title: Damage Diagram
        columns: 1
        fields: []
        color: blue
        widgets:
          - type: overlay
            asset: mech.svg
            alt: Generic mech silhouette
            aspect_ratio: '4 / 3'
            regions:
              - {field: head_armor, label: HEAD, x: 42, y: 4, width: 16, height: 13, display: track, max: 9}
              - {field: torso_armor, label: TORSO, x: 34, y: 25, width: 32, height: 20, display: track, max: 20}
              - {field: left_arm_armor, label: L ARM, x: 4, y: 27, width: 25, height: 16, display: track, max: 12}
              - {field: right_arm_armor, label: R ARM, x: 71, y: 27, width: 25, height: 16, display: track, max: 12}
      - id: pip_states
        title: Multi-State Damage
        columns: 1
        color: purple
        fields:
          - id: damage_pips
            display: state_grid
            count:
              field: chassis
              values: {Scout: 12, Heavy: 18}
              default: 12
            columns: 6
            states:
              - {id: empty, label: Intact}
              - {id: temporary, label: Temporary Damage}
              - {id: permanent, label: Permanent Damage}
      - id: tracks
        title: Tracks
        columns: 2
        color: amber
        fields:
          - {id: heat, display: grid, max: 30, columns: 10}
          - id: ammo
            display: track
            max:
              field: chassis
              values: {Scout: 12, Heavy: 18}
              default: 12
      - id: heavy
        title: Heavy Only
        columns: 1
        color: red
        visible_when: {field: chassis, equals: Heavy}
        fields: [heavy_note]
