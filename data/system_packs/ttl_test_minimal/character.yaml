schema_version: 1
fields:
  name:
    type: text
    label: Character Name
    required: true
  level:
    type: integer
    label: Level
    default: 1
    min: 1
    max: 100
  archetype:
    type: enum
    label: Archetype
    options:
    - Adventurer
    - Scholar
    - Warrior
    default: Adventurer
  active:
    type: boolean
    label: Active
    default: true
  inventory:
    type: collection
    label: Inventory
    item_schema:
      item:
        type: reference
        label: Item
        entity: equipment
        required: false
      quantity:
        type: integer
        label: Qty
        default: 1
        min: 1
      equipped:
        type: boolean
        label: Equipped
        default: false
      notes:
        type: text
        label: Notes
        default: ''
      custom_name:
        type: text
        label: Custom Item
        default: ''
    play_editable: true
    allow_custom: true
    custom_name_field: custom_name
  notes:
    type: notes
    label: Notes
    default: ''
  power_score:
    type: calculated
    label: Power Score
  background:
    type: reference
    label: Background
    entity: background
    default: traveler
  skills:
    type: multi_reference
    label: Skills
    entity: skill
    default: []
  hit_points:
    type: resource
    label: Hit Points
    default:
      current: 10
      max: 10
    play_editable: true
