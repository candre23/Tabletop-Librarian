    message: Level 4 spell slots used cannot exceed the maximum available slots.
    severity: error
  spell_slot_5_used_limit:
    rule: spell_slot_5_used <= spell_slot_5_max
    message: Level 5 spell slots used cannot exceed the maximum available slots.
    severity: error
  spell_slot_6_used_limit:
    rule: spell_slot_6_used <= spell_slot_6_max
    message: Level 6 spell slots used cannot exceed the maximum available slots.
    severity: error
  spell_slot_7_used_limit:
    rule: spell_slot_7_used <= spell_slot_7_max
    message: Level 7 spell slots used cannot exceed the maximum available slots.
    severity: error
  spell_slot_8_used_limit:
    rule: spell_slot_8_used <= spell_slot_8_max
    message: Level 8 spell slots used cannot exceed the maximum available slots.
    severity: error
  spell_slot_9_used_limit:
    rule: spell_slot_9_used <= spell_slot_9_max
    message: Level 9 spell slots used cannot exceed the maximum available slots.
    severity: error
  pact_slots_used_limit:
    rule: pact_slots_used <= pact_slots_max
    message: Pact Magic slots used cannot exceed the maximum available slots.
    severity: error
