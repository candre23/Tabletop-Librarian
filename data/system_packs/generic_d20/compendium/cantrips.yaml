    section: Spell Descriptions
  description: 'Evocation Cantrip (Bard, Cleric, Sorcerer, Wizard)\nCasting Time: Action\nRange: Touch\nComponents: V, M (a
    firefly or phosphorescent moss)\nDuration: 1 hour\nYou touch one Large or smaller object that isn’t\nbeing worn or carried
    by someone else. Until the\nspell ends, the object sheds Bright Light in a 20-foot\nradius and Dim Light for an additional
    20 feet. The\nlight can be colored as you like.\nCovering the object with something opaque blocks\nthe light. The spell
    ends if you cast it again.'
