- id: acid_splash
  name: Acid Splash
  level: 0
  school: Evocation
  special: —
  classes:
  - sorcerer
  - wizard
  tags:
  - level_0
  - evocation
  - class_sorcerer
  - class_wizard
  eligibility:
    rule: (character_class == "sorcerer" and level >= 1) or (character_class == "wizard" and level >= 1)
    message: This spell is not on your class list at your current level.
  source:
    book: srd521
    section: Spell Descriptions
  description: 'Evocation Cantrip (Sorcerer, Wizard)\nCasting Time: Action\nRange: 60 feet\nComponents: V, S\nDuration: Instantaneous\nYou
    create an acidic bubble at a point within range,\nwhere it explodes in a 5-foot-radius Sphere. Each\ncreature in that
    Sphere must succeed on a Dexterity\nsaving throw or take 1d6 Acid damage.\nCantrip Upgrade. The damage increases by 1d6\nwhen
    you reach levels 5 (2d6), 11 (3d6), and 17\n(4d6).'
