  description: 'Conjuration Cantrip (Druid)\nCasting Time: Bonus Action\nRange: Self\nComponents: V, S\nDuration: 10 minutes\nA
    flickering flame appears in your hand and re-\nmains there for the duration. While there, the flame\nemits no heat and
    ignites nothing, and it sheds\nBright Light in a 20-foot radius and Dim Light for an\nadditional 20 feet. The spell ends
    if you cast it again.\nUntil the spell ends, you can take a Magic action to\nhurl fire at a creature or an object within
    60 feet of\nyou. Make a ranged spell attack. On a hit, the target\ntakes 1d8 Fire damage.\nCantrip Upgrade. The damage
    increases by 1d8\nwhen you reach levels 5 (2d8), 11 (3d8), and 17\n(4d8).'
