  description: 'Transmutation Cantrip (Cleric)\nCasting Time: Action\nRange: 30 feet\nComponents: V\nDuration: Up to 1 minute\nYou
    manifest a minor wonder within range. You cre-\nate one of the effects below within range. If you cast\nthis spell multiple
    times, you can have up to three of\nits 1-minute effects active at a time.\nAltered Eyes. You alter the appearance of
    your\neyes for 1 minute.\nBooming Voice. Your voice booms up to three\ntimes as loud as normal for 1 minute. For the dura-\ntion,
    you have Advantage on Charisma (Intimida-\ntion) checks.\nFire Play. You cause flames to flicker, brighten,\ndim, or change
    color for 1 minute.\nInvisible Hand. You instantaneously cause an un-\nlocked door or window to fly open or slam shut.\nPhantom
