      == "warlock" and level >= 1) or (character_class == "wizard" and level >= 1)
    message: This spell is not on your class list at your current level.
  source:
    book: srd521
    section: Spell Descriptions
  description: 'Illusion Cantrip (Bard, Sorcerer, Warlock, Wizard)\nCasting Time: Action\nRange: 30 feet\nComponents: S, M
    (a bit of fleece)\nDuration: 1 minute\nYou create a sound or an image of an object within\nrange that lasts for the duration.
    See the descrip-\ntions below for the effects of each. The illusion ends\nif you cast this spell again.\nIf a creature
    takes a Study action to examine the\nsound or image, the creature can determine that it\nis an illusion with a successful
    Intelligence (Inves-\ntigation) check against your spell save DC. If a crea-\nture discerns the illusion for what it is,
    the illusion\nbecomes faint to the creature.\nSound. If you create a sound, its volume can range\nfrom a whisper to a
    scream. It can be your voice,\nsomeone else’s voice, a lion’s roar, a beating of\ndrums, or any other sound you choose.
    The sound\ncontinues unabated throughout the duration, or you\ncan make discrete sounds at different times before\nthe
    spell ends.\nImage. If you create an image of an object—such\nas a chair, muddy footprints, or a small chest—it\nmust
    be no larger than a 5-foot Cube. The image\ncan’t create sound, light, smell, or any other sensory\neffect. Physical interaction
    with the image reveals it\nto be an illusion, since things can pass through it.'
