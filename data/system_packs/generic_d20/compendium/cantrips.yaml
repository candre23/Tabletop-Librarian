      "druid" and level >= 1) or (character_class == "sorcerer" and level >= 1) or (character_class == "wizard" and level
      >= 1)
    message: This spell is not on your class list at your current level.
  source:
    book: srd521
    section: Spell Descriptions
  description: 'Transmutation Cantrip (Bard, Cleric, Druid, Sorcerer,\nWizard)\nCasting Time: 1 minute\nRange: Touch\nComponents:
    V, S, M (two lodestones)\nDuration: Instantaneous\nThis spell repairs a single break or tear in an object\nyou touch,
    such as a broken chain link, two halves of\na broken key, a torn cloak, or a leaking wineskin. As\nlong as the break or
    tear is no larger than 1 foot in\nany dimension, you mend it, leaving no trace of the\nformer damage.\nThis spell can
    physically repair a magic item, but\nit can’t restore magic to such an object.'
