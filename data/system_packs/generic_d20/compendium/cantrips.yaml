  name: Chill Touch
  level: 0
  school: Necromancy
  special: —
  classes:
  - sorcerer
  - warlock
  - wizard
  tags:
  - level_0
  - necromancy
  - class_sorcerer
  - class_warlock
  - class_wizard
  eligibility:
    rule: (character_class == "sorcerer" and level >= 1) or (character_class == "warlock" and level >= 1) or (character_class
      == "wizard" and level >= 1)
    message: This spell is not on your class list at your current level.
  source:
    book: srd521
    section: Spell Descriptions
  description: 'Necromancy Cantrip (Sorcerer, Warlock, Wizard)\nCasting Time: Action\nRange: Touch\nComponents: V, S\nDuration:
    Instantaneous\nChanneling the chill of the grave, make a melee spell\nattack against a target within reach. On a hit,
    the\ntarget takes 1d10 Necrotic damage, and it can’t re-\ngain Hit Points until the end of your next turn.\nCantrip Upgrade.
    The damage increases by 1d10\nwhen you reach levels 5 (2d10), 11 (3d10), and 17\n(4d10).'
- id: dancing_lights
  name: Dancing Lights
  level: 0
  school: Illusion
  special: C
