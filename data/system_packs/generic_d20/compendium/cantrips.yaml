  description: 'Evocation Cantrip (Sorcerer, Wizard)\nCasting Time: Action\nRange: 120 feet\nComponents: V, S\nDuration: Instantaneous\nYou
    hurl a mote of fire at a creature or an object\nwithin range. Make a ranged spell attack against the\ntarget. On a hit,
    the target takes 1d10 Fire damage.\nA flammable object hit by this spell starts burning if\nit isn’t being worn or carried.\nCantrip
    Upgrade. The damage increases by 1d10\nwhen you reach levels 5 (2d10), 11 (3d10), and 17\n(4d10).'
