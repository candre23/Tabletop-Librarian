  description: 'Transmutation Cantrip (Bard, Druid, Sorcerer,\nWizard)\nCasting Time: Action\nRange: 120 feet\nComponents:
    S, M (a copper wire)\nDuration: 1 round\nSystem Reference Document 5.2.1\n149\nYou point toward a creature within range
    and\nwhisper a message. The target (and only the target)\nhears the message and can reply in a whisper that\nonly you
    can hear.\nYou can cast this spell through solid objects if you\nare familiar with the target and know it is beyond\nthe
    barrier. Magical silence; 1 foot of stone, metal,\nor wood; or a thin sheet of lead blocks the spell.'
- id: minor_illusion
