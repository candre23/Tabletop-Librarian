  - class_bard
  - class_sorcerer
  - class_wizard
  eligibility:
    rule: (character_class == "bard" and level >= 1) or (character_class == "sorcerer" and level >= 1) or (character_class
      == "wizard" and level >= 1)
    message: This spell is not on your class list at your current level.
  source:
    book: srd521
    section: Spell Descriptions
  description: 'Illusion Cantrip (Bard, Sorcerer, Wizard)\nCasting Time: Action\nRange: 120 feet\nComponents: V, S, M (a bit
    of phosphorus)\nDuration: Concentration, up to 1 minute\nSystem Reference Document 5.2.1\n122\nYou create up to four torch-size
    lights within range,\nmaking them appear as torches, lanterns, or glow-\ning orbs that hover for the duration. Alternatively,\nyou
    combine the four lights into one glowing Me-\ndium form that is vaguely humanlike. Whichever\nform you choose, each light
    sheds Dim Light in a 10-\nfoot radius.\nAs a Bonus Action, you can move the lights up\nto 60 feet to a space within range.
    A light must be\nwithin 20 feet of another light created by this spell,\nand a light vanishes if it exceeds the spell’s
    range.'
- id: druidcraft
  name: Druidcraft
  level: 0
  school: Transmutation
  special: —
  classes:
  - druid
  tags:
  - level_0
  - transmutation
  - class_druid
  eligibility:
    rule: (character_class == "druid" and level >= 1)
    message: This spell is not on your class list at your current level.
  source:
    book: srd521
    section: Spell Descriptions
  description: 'Transmutation Cantrip (Druid)\nCasting Time: Action\nRange: 30 feet\nComponents: V, S\nDuration: Instantaneous\nWhispering
    to the spirits of nature, you create one\nof the following effects within range.\nWeather Sensor. You create a Tiny, harmless
    sen-\nsory effect that predicts what the weather will be at\nyour location for the next 24 hours. The effect might\nmanifest
    as a golden orb for clear skies, a cloud for\nrain, falling snowflakes for snow, and so on. This\neffect persists for
    1 round.\nBloom. You instantly make a flower blossom, a\nseed pod open, or a leaf bud bloom.\nSensory Effect. You create
    a harmless sensory ef-\nfect, such as falling leaves, spectral dancing fairies,\na gentle breeze, the sound of an animal,
    or the faint\nodor of skunk. The effect must fit in a 5-foot Cube.\nFire Play. You light or snuff out a candle, a torch,\nor
    a campfire.\nSystem Reference Document 5.2.1\n127'
- id: eldritch_blast
  name: Eldritch Blast
  level: 0
  school: Evocation
  special: —
  classes:
  - warlock
  tags:
  - level_0
  - evocation
  - class_warlock
  eligibility:
    rule: (character_class == "warlock" and level >= 1)
    message: This spell is not on your class list at your current level.
  source:
    book: srd521
    section: Spell Descriptions
  description: 'Evocation Cantrip (Warlock)\nCasting Time: Action\nRange: 120 feet\nComponents: V, S\nDuration: Instantaneous\nYou
    hurl a beam of crackling energy. Make a ranged\nspell attack against one creature or object in range.\nOn a hit, the target
    takes 1d10 Force damage.\nCantrip Upgrade. The spell creates two beams at\nlevel 5, three beams at level 11, and four
    beams at\nlevel 17. You can direct the beams at the same target\nor at different ones. Make a separate attack roll for\neach
    beam.'
- id: elementalism
  name: Elementalism
  level: 0
  school: Transmutation
  special: —
  classes:
  - druid
  - sorcerer
  - wizard
  tags:
  - level_0
  - transmutation
  - class_druid
  - class_sorcerer
  - class_wizard
  eligibility:
    rule: (character_class == "druid" and level >= 1) or (character_class == "sorcerer" and level >= 1) or (character_class
      == "wizard" and level >= 1)
    message: This spell is not on your class list at your current level.
  source:
    book: srd521
    section: Spell Descriptions
  description: 'Transmutation Cantrip (Druid, Sorcerer, Wizard)\nCasting Time: Action\nRange: 30 feet\nComponents: V, S\nDuration:
    Instantaneous\nYou exert control over the elements, creating one of\nthe following effects within range.\nBeckon Air.
    You create a breeze strong enough to\nripple cloth, stir dust, rustle leaves, and close open\ndoors and shutters, all
    in a 5-foot Cube. Doors and\nshutters being held open by someone or something\naren’t affected.\nBeckon Earth. You create
    a thin shroud of dust or\nsand that covers surfaces in a 5-foot-square area, or\nyou cause a single word to appear in
    your handwrit-\ning in a patch of dirt or sand.\nBeckon Fire. You create a thin cloud of harmless\nembers and colored,
    scented smoke in a 5-foot Cube.\nYou choose the color and scent, and the embers can\nlight candles, torches, or lamps
    in that area. The\nsmoke’s scent lingers for 1 minute.\nBeckon Water. You create a spray of cool mist that\nlightly dampens
    creatures and objects in a 5-foot\nCube. Alternatively, you create 1 cup of clean water\neither in an open container or
    on a surface, and the\nwater evaporates in 1 minute.\nSculpt Element. You cause dirt, sand, fire, smoke,\nmist, or water
    that can fit in a 1-foot Cube to assume\na crude shape (such as that of a creature) for 1 hour.'
