- id: savage_attacker
  name: Savage Attacker
  category: Origin
  description: Once per turn when you hit with a weapon, roll the weapon damage dice twice and use either roll.
  source:
    book: srd521
    page: 87
- id: skilled
  name: Skilled
  category: Origin
  description: Gain proficiency in any combination of three skills or tools. Repeatable.
  source:
    book: srd521
    page: 87
- id: ability_score_improvement
  name: Ability Score Improvement
  category: General
  description: Level 4+. Increase one ability by 2 or two abilities by 1, maximum 20. Repeatable.
  eligibility:
    rule: level >= 4
    message: Requires level 4+.
  source:
    book: srd521
    page: 87
- id: grappler
  name: Grappler
  category: General
  description: Level 4+, Strength or Dexterity 13+. Improves grappling and unarmed attacks.
  eligibility:
    rule: level >= 4 and (strength_base + strength_boost >= 13 or dexterity_base + dexterity_boost >= 13)
    message: Requires level 4+ and Strength or Dexterity 13+.
  source:
    book: srd521
    page: 87
- id: archery
  name: Archery
  category: Fighting Style
  description: Fighting Style feat from SRD 5.2.1.
  eligibility:
    rule: (character_class == "fighter") or (level >= 2 and (character_class == "paladin" or character_class ==
      "ranger"))
    message: Requires a Fighting Style feature.
  source:
    book: srd521
    page: 87
