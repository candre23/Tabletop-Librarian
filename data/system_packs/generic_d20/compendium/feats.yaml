entity: feat
entries:
- id: alert
  name: Alert
  category: Origin
  description: Initiative Proficiency and Initiative Swap.
  effects:
    initiative_prof: 1
  source:
    book: srd521
    page: 87
- id: magic_initiate_cleric
  name: Magic Initiate (Cleric)
  category: Origin
  description: Learn two Cleric cantrips and one level 1 Cleric spell; choose Int/Wis/Cha as spellcasting ability.
  source:
    book: srd521
    page: 87
