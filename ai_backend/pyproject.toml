[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tabletop-librarian-ai-backend"
version = "1.0.0"
description = "Cross-platform local llama.cpp backend manager for Tabletop Librarian"
license = "Unlicense"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttl_ai_backend*"]

[project.urls]
Homepage = "https://github.com/candre23/Tabletop-Librarian"
Repository = "https://github.com/candre23/Tabletop-Librarian"

