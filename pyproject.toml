[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tabletop-librarian"
version = "0.1.1"
description = "Self-hosted tabletop RPG library, rules helper, and character resource server."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[tool.setuptools]
packages = ["app"]
