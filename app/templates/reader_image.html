{% extends "base.html" %}

{% block title %}{{ document.display_name }} - {{ app_name }}{% endblock %}

{% block content %}
<section class="reader-shell">
    <div class="reader-toolbar sticky-reader-toolbar">
        <div class="reader-title-group">
            {% if not embed %}<a class="button-link secondary-button compact-button" href="/library/{{ folder.name|urlencode }}">Back</a>{% endif %}
            <div>
                <div class="eyebrow">{{ folder.name }}</div>
                <div class="reader-title">{{ document.display_name }}</div>
            </div>
        </div>

        <div class="image-controls">
            {% if not embed %}
            <a
              class="button-link secondary-button compact-button"
              href="/workspace?document={{ (folder.name ~ '\t' ~ document.key)|urlencode }}"
            >Workspace</a>
            {% endif %}
            <button id="zoomOut" class="secondary-button compact-button">−</button>
            <span id="zoomLabel">Fit</span>
            <button id="zoomIn" class="secondary-button compact-button">+</button>
            <button id="fitImage" class="secondary-button compact-button">Fit</button>
            <button id="actualImage" class="secondary-button compact-button">100%</button>
        </div>
    </div>

    <div id="imageViewport" class="image-reader">
        <img
            id="readerImage"
            src="/content/{{ folder.name|urlencode }}/{{ document.key }}"
            alt="{{ document.display_name }}"
        >
    </div>
</section>

<script>
(() => {
    const image = document.getElementById("readerImage");
    const viewport = document.getElementById("imageViewport");
    const label = document.getElementById("zoomLabel");
    let zoom = null;

    function applyZoom() {
        if (zoom === null) {
            image.style.width = "";
            image.style.height = "";
            image.style.maxWidth = "100%";
            image.style.maxHeight = "100%";
            label.textContent = "Fit";
            return;
        }

        image.style.maxWidth = "none";
        image.style.maxHeight = "none";
        image.style.width = (image.naturalWidth * zoom) + "px";
        image.style.height = "auto";
        label.textContent = Math.round(zoom * 100) + "%";
    }

    function ensureZoom() {
        if (zoom === null) {
            zoom = image.getBoundingClientRect().width / image.naturalWidth;
        }
    }

    document.getElementById("zoomIn").addEventListener("click", () => {
        ensureZoom();
        zoom = Math.min(zoom * 1.25, 8);
        applyZoom();
    });

    document.getElementById("zoomOut").addEventListener("click", () => {
        ensureZoom();
        zoom = Math.max(zoom / 1.25, 0.1);
        applyZoom();
    });

    document.getElementById("fitImage").addEventListener("click", () => {
        zoom = null;
        applyZoom();
    });

    document.getElementById("actualImage").addEventListener("click", () => {
        zoom = 1;
        applyZoom();
    });

    viewport.addEventListener("wheel", event => {
        if (!event.ctrlKey) return;
        event.preventDefault();
        ensureZoom();
        zoom = Math.max(0.1, Math.min(8, zoom * (event.deltaY < 0 ? 1.12 : 0.89)));
        applyZoom();
    }, { passive: false });
})();
</script>
{% endblock %}
