schema_version: 1
fields:
  name:
    type: text
    label: Character Name
    required: true
  level:
    type: integer
    label: Level
    default: 1
    min: 1
    max: 100
  archetype:
    type: reference
    label: Archetype
    entity: archetype
    default: adventurer
  active:
    type: boolean
    label: Active
    default: true
  inventory:
    type: collection
    label: Inventory
  notes:
    type: notes
    label: Notes
    default: ''
  power_score:
    type: calculated
    label: Power Score
  background:
    type: reference
    label: Background
    entity: background
    default: traveler
