calculated:
  unarmed_damage:
    formula: ceil(strength / 2)
  physical_capacity:
    formula: ceil(strength / 2) + 8
  stun_capacity:
    formula: ceil(willpower / 2) + 8

validation:
  awakened_or_emerged:
    rule: not (awakened and emerged)
    message: "A Shadowrun: Anarchy character cannot be both Awakened and Emerged."
    severity: error
  attribute_floor:
    rule: strength >= 1 and agility >= 1 and willpower >= 1 and logic >= 1 and charisma >= 1
    message: "Strength, Agility, Willpower, Logic, and Charisma must each be at least 1."
    severity: error
  human_edge_bonus:
    rule: metatype != "Human" or edge >= 2
    message: "Humans receive +1 Edge from metatype; starting Edge should be at least 2 before leftover Amp points."
    severity: warning
  elf_bonus:
    rule: metatype != "Elf" or (agility >= 2 and charisma >= 2)
    message: "Elves receive +1 Agility and +1 Charisma."
    severity: error
  dwarf_bonus:
    rule: metatype != "Dwarf" or (strength >= 2 and willpower >= 2)
    message: "Dwarfs receive +1 Strength and +1 Willpower."
    severity: error
  ork_bonus:
    rule: metatype != "Ork" or strength >= 3
    message: "Orks receive +2 Strength."
    severity: error
  troll_bonus:
    rule: metatype != "Troll" or strength >= 3
    message: "Trolls receive +2 Strength."
    severity: error
  essence_floor:
    rule: essence >= 0.5
    message: "A player character cannot reduce Essence below 0.5."
    severity: error
  armor_track_matches_choice:
    rule: resource_max(armor) == ((6 if armor_rating == "6" else (12 if armor_rating == "12" else 9)) + (3 if metatype == "Troll" else 0))
    message: "Armor Track maximum should equal the selected base armor plus the Troll +3 Armor bonus, if applicable."
    severity: warning

limits:
  attribute_points:
    field: strength
    label: Attribute Points
    usage: max(0, strength + agility + willpower + logic + charisma - 5 - (0 if metatype == "Human" else 2))
    maximum: 12 if game_level == "Gang" else (20 if game_level == "Prime Runner" else 16)
    require_full: true
    warning_message: "Attribute Points: {count} / {maximum}; spend the full allowance before finishing creation."
    message: "Attribute Points: {count} spent, but only {maximum} are available."

  rated_skill_slots:
    field: skills
    label: Rated Skills
    usage: count(skills) - rowcount(skills, "knowledge", True)
    maximum: 5
    message: "Rated Skills: {count} selected; characters normally begin with no more than {maximum}."

  skill_points:
    field: skills
    label: Skill Points
    usage: rowsum_where(skills, "rating", "knowledge", False) + nonempty_count(skills, "specialization")
    maximum: (10 if game_level == "Gang" else (14 if game_level == "Prime Runner" else 12)) + (1 if metatype == "Human" else (-1 if metatype == "Troll" else 0)) + (1 if armor_rating == "6" else (-1 if armor_rating == "12" else 0))
    require_full: true
    warning_message: "Skill Points: {count} / {maximum}; unused points have no benefit."
    message: "Skill Points: {count} spent, but only {maximum} are available after metatype and armor adjustments."

  knowledge_skill_count:
    field: skills
    label: Knowledge Skills
    usage: rowcount(skills, "knowledge", True)
    maximum: 1
    require_full: true
    warning_message: "Knowledge Skills: {count} / {maximum}; standard creation includes one free Knowledge Skill."
    message: "Knowledge Skills: {count}; standard creation includes one free Knowledge Skill."

  specialization_count:
    field: skills
    label: Specializations
    usage: nonempty_count(skills, "specialization")
    maximum: 1
    message: "Only one Skill Specialization is normally allowed at character creation."

  shadow_amp_slots:
    field: shadow_amps
    label: Shadow Amps
    maximum: 6
    message: "Shadow Amps: {count} selected; the normal maximum is {maximum}."

  shadow_amp_points:
    field: shadow_amps
    label: Amp Points
    usage: rowsum(shadow_amps, "amp_cost") + (2 if awakened or emerged else 0)
    maximum: 6 if game_level == "Gang" else (14 if game_level == "Prime Runner" else 10)
    message: "Amp Points: {count} spent, but only {maximum} are available."

  positive_qualities:
    field: qualities
    label: Positive
    usage: rowcount(qualities, "polarity", "Positive")
    maximum: 2
    require_full: true
    warning_message: "Positive Qualities: {count} / {maximum}."
    message: "Positive Qualities: {count}; creation normally allows {maximum}."

  negative_qualities:
    field: qualities
    label: Negative
    usage: rowcount(qualities, "polarity", "Negative")
    maximum: 1
    require_full: true
    warning_message: "Negative Qualities: {count} / {maximum}."
    message: "Negative Qualities: {count}; creation normally allows {maximum}."

  skill_points_after_armor:
    field: armor_rating
    label: Skill Points after Armor
    usage: rowsum_where(skills, "rating", "knowledge", False) + nonempty_count(skills, "specialization")
    maximum: (10 if game_level == "Gang" else (14 if game_level == "Prime Runner" else 12)) + (1 if metatype == "Human" else (-1 if metatype == "Troll" else 0)) + (1 if armor_rating == "6" else (-1 if armor_rating == "12" else 0))
    message: "Your armor choice reduces the Skill budget to {maximum}, but {count} Skill points are currently spent. Return to the Skills step and rebalance them."

  weapon_count:
    field: weapons
    label: Weapons
    usage: count(weapons)
    maximum: 1 if game_level == "Gang" else (3 if game_level == "Prime Runner" else 2)
    message: "Weapons: {count} selected, but the chosen game level normally allows {maximum}."

  gear_count:
    field: gear
    label: Gear
    usage: count(gear)
    maximum: 3 if game_level == "Gang" else (5 if game_level == "Prime Runner" else 4)
    message: "Gear: {count} selected, but the chosen game level normally allows {maximum}."

  contact_count:
    field: contacts
    label: Contacts
    usage: count(contacts)
    maximum: 1 if game_level == "Gang" else (3 if game_level == "Prime Runner" else 2)
    message: "Contacts: {count} selected, but the chosen game level normally allows {maximum}."
