[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tabletop-librarian"
version = "0.4.12"
description = "Self-hosted tabletop RPG library, rules helper, and character resource server."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "argon2-cffi>=25.1,<26.0",
    "itsdangerous>=2.2,<3.0",
    "pymupdf>=1.26,<2.0",
    "pillow>=11.3,<12.0",
    "markdown>=3.8,<4.0",
    "bleach>=6.2,<7.0",
    "sentence-transformers[openvino]>=5.0,<6.0",
    "numpy>=2.0,<3.0",
]

[tool.setuptools]
packages = ["app", "app.library"]

[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "static/css/*.css",
]
