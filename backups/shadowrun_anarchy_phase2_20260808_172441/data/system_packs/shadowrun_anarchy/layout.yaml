tabs:
- id: sheet
  title: Character Sheet
  sections:
  - id: identity
    title: Identity
    columns: 4
    span: 12
    color: amber
    fields:
    - name
    - tags
    - game_level
    - metatype
    - awakened
    - emerged
    - total_karma
    - karma_spent

  - id: attributes
    title: Attributes
    columns: 3
    span: 8
    color: blue
    fields:
    - id: strength
      display: stat
    - id: agility
      display: stat
    - id: willpower
      display: stat
    - id: logic
      display: stat
    - id: charisma
      display: stat
    - id: edge
      display: stat

  - id: derived
    title: Derived
    columns: 2
    span: 4
    color: teal
    fields:
    - id: essence
      display: stat
    - id: plot_points
      display: stat
    - id: unarmed_damage
      display: stat
    - id: physical_capacity
      display: stat
    - id: stun_capacity
      display: stat

  - id: skills
    title: Skills
    columns: 1
    span: 6
    color: teal
    fields:
    - id: skills
      display: table

  - id: shadow_amps
    title: Shadow Amps
    columns: 1
    span: 6
    color: plum
    fields:
    - id: shadow_amps
      display: table

  - id: qualities
    title: Qualities
    columns: 1
    span: 4
    color: red
    fields:
    - id: qualities
      display: table

  - id: dispositions
    title: Dispositions
    columns: 1
    span: 4
    color: green
    fields:
    - id: dispositions
      display: table

  - id: cues
    title: Cues
    columns: 1
    span: 4
    color: amber
    fields:
    - id: cues
      display: table

  - id: weapons
    title: Weapons
    columns: 1
    span: 12
    color: red
    fields:
    - id: weapons
      display: table

  - id: armor
    title: Armor
    columns: 1
    span: 3
    color: blue
    fields:
    - armor_name
    - id: armor
      display: resource

  - id: condition
    title: Condition
    columns: 1
    span: 4
    color: red
    fields:
    - id: physical_condition
      display: resource
    - id: stun_condition
      display: resource
    - id: matrix_condition
      display: resource

  - id: gear
    title: Gear
    columns: 1
    span: 5
    color: green
    fields:
    - id: gear
      display: table

  - id: contacts_cred
    title: Contacts & Cred
    columns: 3
    span: 12
    color: teal
    fields:
    - id: contacts
      display: table
      span: 2
    - id: street_cred
      display: stat

  - id: background
    title: Background
    columns: 1
    span: 12
    color: amber
    fields:
    - id: background
      display: block
